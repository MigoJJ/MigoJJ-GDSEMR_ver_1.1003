# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/build_environment.html#sec:gradle_configuration_properties

org.gradle.configuration-cache=false
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=all
# Use legacy process launcher to avoid jspawnhelper permission errors in locked-down environments
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv6Addresses=false -Djdk.lang.Process.launchMechanism=FORK
# Separate limit for the desktop app launched by run/start scripts (not the Gradle JVM).
appMaxHeap=1024m
systemProp.java.net.preferIPv4Stack=true
systemProp.java.net.preferIPv6Addresses=false

# Toolchain / dependency versions
# Kept in sync with gradle/libs.versions.toml (server/plugin versions live there instead).
javaVersion=25
javafxVersion=25.0.4
sqliteVersion=3.53.4.0
slf4jVersion=2.0.19

# Restrict toolchain detection to known-good JDKs to avoid repeated warnings
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-openjdk-amd64,/usr/lib/jvm/java-1.25.0-openjdk-amd64
